{% extends 'accounts/index.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Register Account</h2>
    <form id="register-form">
        <div>
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div>
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div>
            <label for="password2">Confirm Password</label>
            <input type="password" id="password2" name="password2" required>
        </div>
        <button type="submit">Register</button>
        <p style="text-align: center;">Already have an account? <a href="{% url 'ui-login' %}">Login here</a></p>
        <div id="message" class="message d-none" role="alert"></div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('register-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const form = e.target;
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        const messageDiv = document.getElementById('message');

        messageDiv.classList.add('d-none');

        try {
            const response = await fetch(`${API_BASE_URL}/register/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (response.ok) {
                messageDiv.textContent = `Registration successful! Redirecting to login...`;
                messageDiv.classList.add('alert-success');
                messageDiv.classList.remove('d-none');
                setTimeout(() => {
                    window.location.href = "{% url 'ui-login' %}";
                }, 1500);
            } else {
                // Show raw error message for simplicity
                let errorMessage = "Registration failed. Details: " + JSON.stringify(result);
                messageDiv.textContent = errorMessage;
                messageDiv.classList.add('alert-danger');
                messageDiv.classList.remove('d-none');
            }

        } catch (error) {
            messageDiv.textContent = `Network error: ${error.message}`;
            messageDiv.classList.add('alert-danger');
            messageDiv.classList.remove('d-none');
        }
    });
</script>
{% endblock %}
