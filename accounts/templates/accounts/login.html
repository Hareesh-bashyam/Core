{% extends 'accounts/index.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Login</h2>
    <form id="login-form">
        <div>
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" style="background-color: #007BFF;">Login</button>
        <p style="text-align: center;">Don't have an account? <a href="{% url 'ui-register' %}">Register now</a></p>
        <div id="message" class="message d-none" role="alert"></div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const form = e.target;
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        const messageDiv = document.getElementById('message');

        messageDiv.classList.add('d-none');

        try {
            const response = await fetch(`${API_BASE_URL}/login/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (response.ok) {
                // Store tokens
                setTokens(result.access, result.refresh);
                
                messageDiv.textContent = `Login successful! Redirecting to home...`;
                messageDiv.classList.add('alert-success');
                messageDiv.classList.remove('d-none');

                setTimeout(() => {
                    window.location.href = "{% url 'home' %}";
                }, 1000);
            } else {
                messageDiv.textContent = result.detail || "Login failed. Check username and password.";
                messageDiv.classList.add('alert-danger');
                messageDiv.classList.remove('d-none');
            }

        } catch (error) {
            messageDiv.textContent = `Network error: ${error.message}`;
            messageDiv.classList.add('alert-danger');
            messageDiv.classList.remove('d-none');
        }
    });
</script>
{% endblock %}
