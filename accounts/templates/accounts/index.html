<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Auth App{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .auth-container { max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 8px; margin: 5px 0 15px 0; display: inline-block; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #4CAF50; color: white; padding: 10px 15px; margin: 8px 0; border: none; cursor: pointer; width: 100%; }
        button:hover { opacity: 0.8; }
        .message { padding: 10px; margin-top: 10px; border-radius: 3px; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .d-none { display: none; }
        .nav-bar { display: flex; justify-content: space-between; padding: 10px; background-color: #f1f1f1; }
        .nav-bar a, .nav-bar button { margin-left: 10px; text-decoration: none; border: none; background: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="nav-bar">
        <span><a href="{% url 'home' %}">Home</a></span>
        <div>
            <a href="{% url 'ui-login' %}">Login</a>
            <a href="{% url 'ui-register' %}">Register</a>
            <button id="logout-button-nav">Logout</button>
        </div>
    </div>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script>
        const API_BASE_URL = '/api/auth'; 

        function setTokens(access, refresh) {
            localStorage.setItem('accessToken', access);
            localStorage.setItem('refreshToken', refresh);
        }

        function getAccessToken() {
            return localStorage.getItem('accessToken');
        }

        function getRefreshToken() {
            return localStorage.getItem('refreshToken');
        }

        function clearTokens() {
            localStorage.removeItem('accessToken');
            localStorage.removeItem('refreshToken');
        }

        async function globalLogout() {
            const refreshToken = getRefreshToken();
            if (refreshToken) {
                try {
                    await fetch(`${API_BASE_URL}/logout/`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ refresh: refreshToken })
                    });
                } catch (error) {
                    console.error('Logout failed:', error);
                }
            }
            clearTokens();
            // Redirect after clearing tokens
            window.location.href = "{% url 'ui-login' %}";
        }

        document.addEventListener('DOMContentLoaded', () => {
            const logoutNavButton = document.getElementById('logout-button-nav');
            if (logoutNavButton) {
                logoutNavButton.addEventListener('click', globalLogout);
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
